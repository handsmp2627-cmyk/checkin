<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<title>SMP Field Check-in</title>
<style>
:root{--bg:#f3f6f2;--card:#ffffff;--ink:#17231d;--muted:#5b6a61;--line:#d6ddd5;--accent:#0f6b5c;--dark:#17231d;
  --ok:#dcefe2;--warn:#f5e8cf;--bad:#f6dcd9;--bad-ink:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:460px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.top b{color:var(--ink)}
.en{display:block;font-size:.8em;color:var(--muted);direction:ltr;text-align:right}
.school{font-size:22px;font-weight:700;line-height:1.35}
.sid{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted)}
.who{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:19px;font-weight:700;border:0;border-radius:14px;padding:18px;width:100%;cursor:pointer;color:#fff;background:var(--accent)}
.btn.out{background:var(--dark)}
.btn.ghost{background:transparent;color:var(--accent);font-size:15px;padding:10px}
.btn:disabled{opacity:.55}
.btn:focus-visible,input:focus-visible{outline:3px solid #7cc4b5;outline-offset:2px}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input{font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);direction:ltr}
.res{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.res h2{margin:0;font-size:20px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.err{color:var(--bad-ink);font-size:14px;margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
dt{color:var(--muted)}dd{margin:0;direction:ltr;text-align:end;font-variant-numeric:tabular-nums}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:24px auto 8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.queue{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ============ SETTINGS: paste the Apps Script web app address here ============ */
const API = 'https://script.google.com/macros/s/AKfycbyYlUVDJwgaYsQQvA9hhO6wNj5XXb3szsFrIVWee8sxr9yhLpnjRpd2PF2ZcbrEQFq2FA/exec';
/* ============================================================================ */

const $app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const SCHOOL = (params.get('s') || '').trim().toUpperCase();
const REG = SCHOOL === 'JOIN';   // team registration QR (?s=JOIN)

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
function deviceToken() {
  let t = store.get('smp_token', null);
  if (!t) {
    t = 'dv-' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    store.set('smp_token', t);
  }
  return t;
}
const TOKEN = deviceToken();
let state = { school: null, staff: store.get('smp_staff', null), open: null };

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmm = iso => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const dist = m => m === '' || m == null ? '—' : (m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m + ' m');

/* ---------- network ---------- */
async function apiGet(q) {
  const r = await fetch(API + '?' + new URLSearchParams(q), { redirect: 'follow' });
  return r.json();
}
async function apiPost(body) {
  // text/plain keeps this a simple request (no CORS preflight), which Apps Script accepts
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
  return r.json();
}

/* ---------- offline queue: scans made without signal are sent later ---------- */
function queued() { return store.get('smp_queue', []); }
async function flushQueue() {
  const q = queued(); if (!q.length || !navigator.onLine) return;
  const left = [];
  for (const item of q) {
    try { const r = await apiPost(item); if (!r.ok && r.error === 'server_error') left.push(item); }
    catch (e) { left.push(item); }
  }
  store.set('smp_queue', left);
}
window.addEventListener('online', () => { flushQueue(); });

/* ---------- location: take the best fix within 15 seconds ---------- */
function getFix() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 0 });
    let best = null, finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      navigator.geolocation.clearWatch(id); clearTimeout(timer);
      best ? resolve(best) : reject({ code: 3 });
    };
    const id = navigator.geolocation.watchPosition(p => {
      if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      if (p.coords.accuracy <= 15) finish();
    }, err => { if (err.code === 1) { finished = true; navigator.geolocation.clearWatch(id); clearTimeout(timer); reject(err); } },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    const timer = setTimeout(finish, 15000);
  });
}

/* ---------- screens ---------- */
function shell(inner) {
  const q = queued().length;
  $app.innerHTML = `<div class="top"><b>SMP · Field Check-in</b><span class="sid">${REG ? '' : esc(SCHOOL || '')}</span></div>${inner}
    ${q ? `<p class="queue">${q} scan(s) saved on this phone, will send when signal returns<br>محفوظة على الهاتف وسترسل عند توفر الإنترنت</p>` : ''}`;
}

function viewLoading(msg) { shell(`<div class="spin" aria-hidden="true"></div><p style="text-align:center;margin:0">${msg}</p>`); }

function viewMessage(cls, title, body) {
  shell(`<div class="res ${cls}"><h2>${title}</h2><div>${body}</div></div>
    <div class="actions"><button class="btn ghost" onclick="start()">Try again · حاول مجددًا</button></div>`);
}

function viewRegister(err) {
  const title = REG ? `<div class="school">تسجيل هاتف الفريق<span class="en">Team phone registration</span></div>`
                    : `<div class="school">${esc(state.school ? state.school.name : SCHOOL)}</div>`;
  shell(`${title}
  <div class="card">
    <div>أدخل الرمز الشخصي الذي استلمته. تقوم بذلك مرة واحدة فقط.<span class="en">Enter the personal PIN you received. You only do this once.</span></div>
    <label for="pin">الرمز الشخصي · PIN<input id="pin" inputmode="numeric" autocomplete="off" maxlength="6"></label>
    ${err ? `<p class="err">${err}</p>` : ''}
  </div>
  <div class="actions"><button class="btn" id="next">التالي · Next</button></div>`);
  document.getElementById('next').onclick = checkPin;
}

function viewConfirm(st, pin, err) {
  shell(`<div class="school">${esc(st.name)}</div>
  <div class="who">${esc(st.role || '')} <span class="sid">· ${esc(st.id)}</span></div>
  <div class="card">
    <div>هل هذا أنت؟ أدخل رقم هاتفك ثم سجّل.<span class="en">Is this you? Enter your phone number, then register.</span></div>
    <label for="phone">رقم الهاتف · Phone number<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="70 123 456"></label>
    ${err ? `<p class="err">${err}</p>` : ''}
  </div>
  <div class="actions"><button class="btn" id="reg">تسجيل هذا الهاتف · Register this phone</button>
  <button class="btn ghost" onclick="viewRegister()">ليس أنا · Not me</button></div>`);
  document.getElementById('reg').onclick = () => register(st, pin);
}

function viewRegistered(st) {
  shell(`<div class="res ok"><h2>تم التسجيل · Registered</h2>
    <div>${esc(st.name)}، هاتفك مسجّل الآن. من الآن فصاعدًا امسح رمز QR في المدرسة عند الوصول وعند المغادرة.
    <span class="en">${esc(st.name)}, your phone is registered. From now on, scan the QR at the school when you arrive and when you leave.</span></div></div>`);
}

function viewMain() {
  const s = state.school, st = state.staff, online = navigator.onLine && !state.offline;
  let buttons;
  if (!online) {
    buttons = `<button class="btn" onclick="scan('in')">وصول · Arriving</button>
               <button class="btn out" onclick="scan('out')">مغادرة · Leaving</button>`;
  } else if (state.open) {
    buttons = `<button class="btn out" onclick="scan()">تسجيل خروج · Check out</button>`;
  } else {
    buttons = `<button class="btn" onclick="scan()">تسجيل دخول · Check in</button>`;
  }
  shell(`<div class="school">${esc(s ? s.name : SCHOOL)}</div>
    <div class="who">${esc(st.name)} <span class="sid">· ${esc(st.id)}</span></div>
    ${state.open ? `<div class="card">دخلت الساعة <b dir="ltr">${hhmm(state.open.checkIn)}</b><span class="en">Checked in at ${hhmm(state.open.checkIn)}</span></div>` : ''}
    ${!online ? `<div class="card">لا يوجد إنترنت. سيُحفظ التسجيل ويُرسل لاحقًا.<span class="en">No signal. Your scan will be saved and sent later.</span></div>` : ''}
    <div class="actions">${buttons}</div>`);
}

function viewResult(r, fix) {
  const cls = r.outside ? 'bad' : r.weak ? 'warn' : 'ok';
  const isIn = r.kind === 'in';
  const title = isIn ? 'تم تسجيل الدخول · Checked in' : 'تم تسجيل الخروج · Checked out';
  const note = r.outside
    ? `أنت على بعد ${dist(r.distance)} من المدرسة. سيراجع المشرف هذه الزيارة.<span class="en">You are ${dist(r.distance)} from the school. This visit will be reviewed.</span>`
    : r.weak ? `إشارة الموقع ضعيفة. قف في الخارج في المرة القادمة.<span class="en">Weak location signal. Stand outside next time.</span>`
    : isIn ? `امسح الرمز مجددًا عند المغادرة.<span class="en">Scan again when you leave.</span>` : `شكرًا.<span class="en">Thank you.</span>`;
  shell(`<div class="res ${cls}"><h2>${title}</h2><div>${note}</div></div>
    <dl><dt>School</dt><dd>${esc(state.school ? state.school.id : SCHOOL)}</dd>
    <dt>Time</dt><dd>${hhmm(r.time)}</dd>
    ${r.minutes != null ? `<dt>On site</dt><dd>${r.minutes} min</dd>` : ''}
    <dt>Distance</dt><dd>${dist(r.distance)}</dd>
    <dt>Accuracy</dt><dd>±${Math.round(fix.coords.accuracy)} m</dd></dl>`);
}

/* ---------- actions ---------- */
const REG_ERRORS = {
  bad_pin: 'الرمز غير صحيح · Wrong PIN.',
  inactive: 'هذا الحساب غير مفعّل · This account is not active.',
  bad_phone: 'أدخل رقم هاتف صحيح · Enter a valid phone number.',
  busy: 'الخادم مشغول، حاول بعد لحظات · Server busy, try again in a moment.',
};

async function checkPin() {
  const pin = document.getElementById('pin').value.trim();
  if (!pin) return viewRegister('أدخل الرمز · Enter your PIN.');
  viewLoading('جارٍ التحقق… · Checking…');
  try {
    const r = await apiPost({ action: 'register', pin, token: TOKEN });
    if (r.ok && r.step === 'confirm') return viewConfirm(r.staff, pin);
    viewRegister(REG_ERRORS[r.error] || 'حدث خطأ · Something went wrong.');
  } catch (e) { viewRegister('لا يوجد إنترنت · No connection. Registration needs signal.'); }
}

async function register(st, pin) {
  const phone = document.getElementById('phone').value.trim();
  if (phone.replace(/\D/g, '').length < 7) return viewConfirm(st, pin, REG_ERRORS.bad_phone);
  viewLoading('جارٍ التسجيل… · Registering…');
  try {
    const r = await apiPost({ action: 'register', pin, phone, confirm: true, token: TOKEN });
    if (r.ok) {
      state.staff = r.staff; store.set('smp_staff', r.staff);
      return REG ? viewRegistered(r.staff) : start();
    }
    if (r.error === 'pending') return viewMessage('warn', 'بانتظار الموافقة · Waiting for approval',
      'لديك هاتف آخر مسجّل. يجب أن يوافق المشرف على الهاتف الجديد.<span class="en">You already have another phone registered. Your supervisor has to approve this one.</span>');
    if (r.error === 'phone_in_use') return viewMessage('bad', 'الهاتف مسجّل مسبقًا · Phone already registered',
      `هذا الهاتف مسجّل باسم ${esc(r.name)}. كل شخص يسجّل على هاتفه فقط.<span class="en">This phone is already registered to ${esc(r.name)}. Each person registers on their own phone.</span>`);
    viewConfirm(st, pin, REG_ERRORS[r.error] || 'حدث خطأ · Something went wrong.');
  } catch (e) { viewConfirm(st, pin, 'لا يوجد إنترنت · No connection.'); }
}

async function scan(kind) {
  viewLoading('جارٍ تحديد الموقع… · Getting your location…');
  let fix;
  try { fix = await getFix(); }
  catch (e) {
    return viewMessage('bad', 'الموقع غير متاح · Location unavailable', e.code === 1
      ? 'اسمح للمتصفح باستخدام الموقع من الإعدادات ثم حاول مجددًا.<span class="en">Allow location for this page in your browser settings, then try again.</span>'
      : 'فعّل الموقع (GPS) وقف في الخارج ثم حاول مجددًا.<span class="en">Turn on location (GPS), step outside, and try again.</span>');
  }
  const body = { action: 'scan', token: TOKEN, school: SCHOOL, lat: fix.coords.latitude, lng: fix.coords.longitude,
                 acc: fix.coords.accuracy, phoneTime: Date.now(), kind: kind || null };
  if (!navigator.onLine || state.offline) return saveOffline(body, fix);
  try {
    const r = await apiPost(body);
    if (!r.ok) {
      if (r.error === 'not_registered') { store.set('smp_staff', null); state.staff = null; return viewRegister(); }
      if (r.error === 'pending') return viewMessage('warn', 'بانتظار الموافقة · Waiting for approval', 'The supervisor has not approved this phone yet.');
      return viewMessage('bad', 'لم يُسجّل · Not recorded', 'حدث خطأ. حاول مجددًا.<span class="en">Something went wrong. Try again.</span>');
    }
    state.open = r.kind === 'in' ? { checkIn: r.time } : null;
    viewResult(r, fix);
  } catch (e) { saveOffline(body, fix); }
}

function saveOffline(body, fix) {
  body.queued = true;
  if (!body.kind) body.kind = state.open ? 'out' : 'in';
  const q = queued(); q.push(body); store.set('smp_queue', q);
  shell(`<div class="res warn"><h2>محفوظ على الهاتف · Saved on phone</h2>
    <div>لا يوجد إنترنت. سيُرسل التسجيل تلقائيًا عند فتح الصفحة مع توفر الإنترنت.<span class="en">No signal. It will be sent automatically next time this page opens with signal.</span></div></div>
    <dl><dt>Time</dt><dd>${hhmm(body.phoneTime)}</dd><dt>Accuracy</dt><dd>±${Math.round(fix.coords.accuracy)} m</dd></dl>`);
}

async function startReg() {
  viewLoading('جارٍ التحميل… · Loading…');
  try {
    const r = await apiGet({ action: 'whoami', token: TOKEN });
    if (r.staff) { store.set('smp_staff', r.staff); return viewRegistered(r.staff); }
    if (r.pending) return viewMessage('warn', 'بانتظار الموافقة · Waiting for approval', 'The supervisor has not approved this phone yet.');
    return viewRegister();
  } catch (e) { return viewMessage('bad', 'لا يوجد إنترنت · No connection', 'التسجيل يحتاج إلى إنترنت.<span class="en">Registration needs signal.</span>'); }
}

async function start() {
  if (REG) return startReg();
  if (!SCHOOL) return shell(`<div class="res warn"><h2>امسح رمز المدرسة · Scan the school QR</h2><div>افتح هذه الصفحة عبر رمز QR الموجود في المدرسة.<span class="en">Open this page by scanning the QR code posted at the school.</span></div></div>`);
  viewLoading('جارٍ التحميل… · Loading…');
  state.offline = false;
  await flushQueue();
  try {
    const r = await apiGet({ action: 'status', token: TOKEN, school: SCHOOL });
    if (!r.ok && r.error === 'unknown_school') return viewMessage('bad', 'رمز غير معروف · Unknown QR', 'This QR code is not in the school list.');
    state.school = r.school; state.open = r.open || null;
    if (r.staff) { state.staff = r.staff; store.set('smp_staff', r.staff); return viewMain(); }
    store.set('smp_staff', null); state.staff = null;
    if (r.pending) return viewMessage('warn', 'بانتظار الموافقة · Waiting for approval', 'The supervisor has not approved this phone yet.');
    return viewRegister();
  } catch (e) {
    state.offline = true;
    if (state.staff) return viewMain();
    return viewMessage('bad', 'لا يوجد إنترنت · No connection', 'التسجيل الأول يحتاج إلى إنترنت.<span class="en">The first registration needs signal.</span>');
  }
}
start();
</script>
</body>
</html>
